version: '3.8'

# Docker Compose configuration with SSL support
# Use this file with: docker-compose -f docker-compose-ssl.yml up -d
#
# Prerequisites:
# 1. Generate SSL certificates using the System Settings page, or
# 2. Place your own certificates in ./ssl/ directory:
#    - ./ssl/server.crt (certificate file)
#    - ./ssl/server.key (private key file)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=False
      - DATABASE_URI=sqlite:///server_manager.db
      - SERVER_FILES_DIR=/app/server_files
      # SECURITY: For production, set secure SECRET_KEY and ENCRYPTION_KEY
      # Generate ENCRYPTION_KEY with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Generate SECRET_KEY with: python -c "import secrets; print(secrets.token_hex(32))"
      # Uncomment and set secure values for production:
      # - SECRET_KEY=your-generated-secret-key-here
      # - ENCRYPTION_KEY=your-generated-encryption-key-here
      # - JWT_SECRET_KEY=your-generated-jwt-secret-key-here
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
      # Mount host server files directory - set SERVER_FILES_HOST_DIR env var or use ./server_files
      - ${SERVER_FILES_HOST_DIR:-./server_files}:/app/server_files:ro
      # Mount SSL directory for certificate generation
      - ./ssl:/etc/ssl/server-manager
    command: python app.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:443"
      - "3080:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=https://localhost:3000/api
    volumes:
      # Mount SSL certificates
      - ./ssl:/etc/nginx/ssl:ro
      # Use SSL-enabled nginx config
      - ./frontend/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_data:
